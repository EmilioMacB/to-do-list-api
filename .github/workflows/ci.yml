# CI: corre los tests en cada Pull Request hacia main.
# La branch protection de main exige que el job "tests" pase antes del merge.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

# Si llegan pushes nuevos al mismo PR, cancela la corrida anterior (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # mínimo privilegio: solo leer el código

jobs:
  tests:
    name: tests # este nombre es el "status check" requerido en la branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python 3.12 (misma versión que la EC2 con Ubuntu 24.04)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: pytest
