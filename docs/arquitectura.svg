<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#555;stroke-width:1.2}
    .t{fill:#1f2328}
    .b{font-weight:bold}
    .s{font-size:11.5px;fill:#444}
    .ln{fill:none;stroke:#333;stroke-width:1.5;marker-end:url(#a)}
    .dl{fill:none;stroke:#333;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#a)}
    .lbl{font-size:11.5px;fill:#333;font-style:italic}
  </style>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="640" y="32" text-anchor="middle" font-size="19" class="t b">Arquitectura — to-do-list-api (CI/CD + Observabilidad)</text>

  <!-- Desarrollador -->
  <rect class="box" x="110" y="58" width="200" height="44" rx="6"/>
  <text x="210" y="77" text-anchor="middle" class="t b">Desarrollador</text>
  <text x="210" y="93" text-anchor="middle" class="s">git push · Pull Request · tag v#.#.#</text>
  <path class="ln" d="M210,102 L210,127"/>

  <!-- GitHub -->
  <rect x="20" y="130" width="400" height="570" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/>
  <text x="34" y="150" class="t b" font-size="14">GitHub</text>
  <rect class="box" x="40" y="165" width="360" height="50" rx="6"/>
  <text x="220" y="186" text-anchor="middle" class="t b">Repositorio EmilioMacB/to-do-list-api</text>
  <text x="220" y="203" text-anchor="middle" class="s">main protegida: merge solo con PR + check "tests" verde</text>
  <text x="34" y="242" class="t b">GitHub Actions</text>

  <rect class="box" x="40" y="252" width="360" height="48" rx="6"/>
  <text x="52" y="272" class="t b">provision.yml</text><text x="52" y="289" class="s">manual · bootstrap S3 → terraform plan/apply → espera /health</text>
  <rect class="box" x="40" y="312" width="360" height="48" rx="6"/>
  <text x="52" y="332" class="t b">destroy.yml</text><text x="52" y="349" class="s">manual · confirmar con "destroy" → terraform destroy</text>
  <rect class="box" x="40" y="372" width="360" height="48" rx="6"/>
  <text x="52" y="392" class="t b">ci.yml</text><text x="52" y="409" class="s">al abrir PR · pytest (15 pruebas) → bloquea el merge si falla</text>
  <rect class="box" x="40" y="432" width="360" height="48" rx="6"/>
  <text x="52" y="452" class="t b">release.yml</text><text x="52" y="469" class="s">push de tag v#.#.# → GitHub Release con el repo en .zip</text>
  <rect class="box" x="40" y="492" width="360" height="48" rx="6"/>
  <text x="52" y="512" class="t b">deploy.yml</text><text x="52" y="529" class="s">release publicado → SSM Run Command → valida GET /version</text>
  <rect class="box" x="40" y="552" width="360" height="48" rx="6"/>
  <text x="52" y="572" class="t b">health-check.yml</text><text x="52" y="589" class="s">cron cada 5 min · GET /health (3 intentos)</text>

  <rect x="40" y="630" width="360" height="50" rx="6" fill="#fff" stroke="#555" stroke-dasharray="5 3"/>
  <text x="220" y="651" text-anchor="middle" class="t b">GitHub Release vX.Y.Z</text>
  <text x="220" y="668" text-anchor="middle" class="s">asset todo-api-vX.Y.Z.zip</text>
  <path class="ln" d="M40,456 L30,456 L30,655 L38,655"/>

  <!-- AWS -->
  <rect x="520" y="130" width="740" height="560" rx="10" fill="#fff8ef" stroke="#ff9900" stroke-width="2"/>
  <text x="534" y="150" class="t b" font-size="14">AWS · us-east-1 (Learner Lab)</text>

  <rect class="box" x="545" y="165" width="300" height="60" rx="6"/>
  <text x="695" y="186" text-anchor="middle" class="t b">S3 · backend remoto de Terraform</text>
  <text x="695" y="202" text-anchor="middle" class="s">todo-api-tfstate-&lt;ACCOUNT_ID&gt;/todo-list-api/</text>
  <text x="695" y="217" text-anchor="middle" class="s">terraform.tfstate · versionado · cifrado · lock</text>

  <rect x="860" y="165" width="380" height="60" rx="6" fill="#fff" stroke="#999" stroke-dasharray="5 3"/>
  <text x="872" y="186" class="s">Terraform crea / destruye todo lo de este recuadro:</text>
  <text x="872" y="202" class="s">EC2, Security Groups, Key Pair, RDS, Secret (random_password),</text>
  <text x="872" y="218" class="s">tópico SNS, 3 alarmas y dashboard (leídos de alerting/*.json)</text>

  <!-- provision / destroy -> S3 -->
  <path class="ln" d="M400,276 L470,276 L470,212 L543,212"/>
  <path fill="none" stroke="#333" stroke-width="1.5" d="M400,336 L470,336 L470,276"/>
  <text x="476" y="250" class="lbl">state</text>

  <!-- VPC -->
  <rect x="545" y="260" width="470" height="250" rx="8" fill="none" stroke="#1e8e3e" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="557" y="278" class="s" fill="#1e8e3e">VPC default</text>

  <rect class="box" x="565" y="290" width="240" height="190" rx="6" stroke="#ff9900"/>
  <text x="685" y="311" text-anchor="middle" class="t b">EC2 t2.micro · Ubuntu 24.04</text>
  <text x="577" y="333" class="s">• systemd "todo-api": FastAPI en :8000</text>
  <text x="577" y="351" class="s">• APP_VERSION en /etc/todo-api.env</text>
  <text x="577" y="369" class="s">• user_data: clona repo, venv, systemd</text>
  <text x="577" y="387" class="s">• LabInstanceProfile (Secrets, CW, SSM)</text>
  <text x="577" y="405" class="s">• SG: 8000 público · 22 solo emergencia</text>
  <text x="577" y="423" class="s">• Key Pair generado por Terraform</text>
  <text x="577" y="441" class="s">• GET/POST /tasks · /version · /health</text>

  <rect class="box" x="830" y="330" width="165" height="100" rx="6" stroke="#3b48cc"/>
  <text x="912" y="352" text-anchor="middle" class="t b">RDS PostgreSQL 15</text>
  <text x="912" y="370" text-anchor="middle" class="s">db.t3.micro · tododb</text>
  <text x="912" y="388" text-anchor="middle" class="s">no pública · SG 5432</text>
  <text x="912" y="404" text-anchor="middle" class="s">solo desde el SG</text>
  <text x="912" y="418" text-anchor="middle" class="s">de la EC2</text>
  <path class="ln" d="M805,380 L828,380"/>

  <rect class="box" x="1040" y="280" width="200" height="70" rx="6" stroke="#dd344c"/>
  <text x="1140" y="302" text-anchor="middle" class="t b">Secrets Manager</text>
  <text x="1140" y="320" text-anchor="middle" class="s">todo-api/db-credentials</text>
  <text x="1140" y="336" text-anchor="middle" class="s">user, password, host, port, db</text>
  <path class="ln" d="M805,305 L1038,305"/>
  <text x="815" y="298" class="lbl">lee credenciales en runtime (boto3)</text>

  <rect class="box" x="1040" y="400" width="200" height="120" rx="6" stroke="#e7157b"/>
  <text x="1140" y="421" text-anchor="middle" class="t b">CloudWatch</text>
  <text x="1052" y="441" class="s">• AWS/EC2 CPUUtilization</text>
  <text x="1052" y="458" class="s">• TodoApi/DatabaseErrors</text>
  <text x="1052" y="475" class="s">• TodoApi/RequestLatency</text>
  <text x="1052" y="495" class="s">• 3 alarmas · 1 dashboard</text>
  <path class="ln" d="M805,460 L1038,460"/>
  <text x="840" y="453" class="lbl">put_metric_data + métrica nativa</text>

  <rect class="box" x="1040" y="590" width="200" height="56" rx="6" stroke="#e7157b"/>
  <text x="1140" y="613" text-anchor="middle" class="t b">SNS · todo-api-alerts</text>
  <text x="1140" y="630" text-anchor="middle" class="s">ALARM y OK de las 3 alarmas</text>
  <path class="ln" d="M1140,520 L1140,588"/>
  <text x="1148" y="560" class="lbl">dispara</text>

  <!-- Deploy y health-check -> EC2 -->
  <path class="ln" d="M400,516 L500,516 L500,400 L563,400"/>
  <text x="430" y="510" class="lbl">SSM</text>
  <path class="ln" d="M400,576 L530,576 L530,450 L563,450"/>
  <text x="430" y="570" class="lbl">GET /health</text>
  <!-- Código hacia la EC2 -->
  <path class="dl" d="M400,655 L640,655 L640,482"/>
  <text x="632" y="610" text-anchor="end" class="lbl">user_data: git clone</text><text x="632" y="626" text-anchor="end" class="lbl">deploy: descarga el .zip</text>

  <!-- Externos -->
  <rect class="box" x="1040" y="730" width="200" height="44" rx="6"/>
  <text x="1140" y="750" text-anchor="middle" class="t b">Correo del equipo</text>
  <text x="1140" y="766" text-anchor="middle" class="s">suscripción confirmada</text>
  <path class="ln" d="M1140,646 L1140,728"/>

  <rect class="box" x="600" y="730" width="200" height="44" rx="6"/>
  <text x="700" y="750" text-anchor="middle" class="t b">Cliente (curl / navegador)</text>
  <text x="700" y="766" text-anchor="middle" class="s">http://&lt;ip-ec2&gt;:8000</text>
  <path class="ln" d="M700,730 L700,482"/>
</svg>
